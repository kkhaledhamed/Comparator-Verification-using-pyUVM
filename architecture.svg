<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f2f2"/>
    </marker>
    <style>
      .t { fill:#fff; font-weight:700; font-size:15px; text-anchor:middle; }
      .title { fill:#fff; font-weight:700; font-size:19px; text-anchor:middle; }
      .cfg { fill:#e6e6e6; font-size:11px; font-weight:700; text-anchor:middle; }
      .ln { stroke:#f2f2f2; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="#0d1117"/>

  <!-- Test bench -->
  <rect x="10" y="10" width="880" height="620" rx="4" fill="#10141c" stroke="#d0d0d0" stroke-width="2"/>
  <text x="450" y="38" class="title">Test bench</text>

  <!-- Test -->
  <rect x="40" y="52" width="820" height="425" fill="#0a1a2b" stroke="#00b4d8" stroke-width="2.5"/>
  <text x="450" y="76" class="title">Test</text>

  <!-- Sequence -->
  <rect x="130" y="92" width="130" height="36" fill="#6b7a1a" stroke="#d9d94a" stroke-width="1.5"/>
  <text x="195" y="116" class="t">Sequence</text>

  <!-- Verification Environment -->
  <rect x="65" y="142" width="770" height="318" fill="#1a0f26" stroke="#a855f7" stroke-width="2.5"/>
  <text x="450" y="166" class="title">Verification Environment</text>

  <!-- Agent -->
  <rect x="95" y="182" width="470" height="262" fill="#0e2230" stroke="#22d3ee" stroke-width="2"/>
  <text x="330" y="208" class="title">Agent</text>

  <!-- Sequencer -->
  <rect x="130" y="222" width="130" height="36" fill="#6b7a1a" stroke="#d9d94a" stroke-width="1.5"/>
  <text x="195" y="246" class="t">Sequencer</text>

  <!-- Driver -->
  <rect x="130" y="310" width="130" height="90" fill="#6b4010" stroke="#f0a050" stroke-width="1.5"/>
  <text x="195" y="360" class="t">Driver</text>

  <!-- Monitor -->
  <rect x="380" y="310" width="130" height="90" fill="#5c3328" stroke="#f08a70" stroke-width="1.5"/>
  <text x="445" y="360" class="t">Monitor</text>

  <!-- Scoreboard -->
  <rect x="640" y="255" width="150" height="50" fill="#355a28" stroke="#8fd16a" stroke-width="1.5"/>
  <text x="715" y="285" class="t">Scoreboard</text>

  <!-- CFG tags -->
  <rect x="505" y="190" width="42" height="20" fill="#2a2f3a" stroke="#c8c8c8" stroke-width="1"/>
  <text x="526" y="204" class="cfg">CFG</text>
  <rect x="740" y="415" width="42" height="20" fill="#2a2f3a" stroke="#c8c8c8" stroke-width="1"/>
  <text x="761" y="429" class="cfg">CFG</text>

  <!-- Sequence <-> Sequencer -->
  <line x1="185" y1="128" x2="185" y2="220" class="ln"/>
  <line x1="205" y1="222" x2="205" y2="130" class="ln"/>

  <!-- Sequencer <-> Driver -->
  <line x1="185" y1="258" x2="185" y2="308" class="ln"/>
  <line x1="205" y1="310" x2="205" y2="260" class="ln"/>

  <!-- Monitor -> Scoreboard -->
  <path d="M510 355 H600 V280 H638" class="ln"/>

  <!-- BFM -->
  <rect x="125" y="505" width="390" height="48" fill="#3d4450" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="320" y="526" class="t">BFM:</text>
  <text x="320" y="545" class="t">Bus Functional Model</text>

  <!-- Driver <-> BFM -->
  <line x1="185" y1="400" x2="185" y2="503" class="ln"/>
  <line x1="205" y1="505" x2="205" y2="402" class="ln"/>

  <!-- BFM -> Monitor -->
  <line x1="445" y1="505" x2="445" y2="402" class="ln"/>

  <!-- DUT -->
  <rect x="200" y="583" width="240" height="38" fill="#6b2a30" stroke="#e08a90" stroke-width="1.5"/>
  <text x="320" y="608" class="title">DUT</text>

  <!-- BFM <-> DUT -->
  <line x1="300" y1="553" x2="300" y2="581" class="ln"/>
  <line x1="340" y1="583" x2="340" y2="555" class="ln"/>
</svg>
